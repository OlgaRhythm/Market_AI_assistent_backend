name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SQLite native module
        run: npm rebuild sqlite3 --build-from-source
      - name: Run regression and API security tests
        run: npm run test:allure
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: allure-results-backend/
          retention-days: 14
      - name: Compile TypeScript
        run: npm run build
      - name: Build Docker image
        if: ${{ github.repository != 'OlgaRhythm/Market_AI_assistent_backend' || github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: docker build --tag app:ci .

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      SEMGREP_IMAGE: semgrep/semgrep:1.184.0
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create report directory
        run: mkdir -p "$RUNNER_TEMP/ci-reports"
      - name: Check Git history and files for secrets
        run: |
          scan() {
            docker run --rm \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              "$GITLEAKS_IMAGE" "$@"
          }
          status=0
          scan git --log-opts=--all --redact=100 --report-format=json --report-path=/reports/gitleaks-history.json /repo || status=$?
          scan dir --redact=100 --report-format=json --report-path=/reports/gitleaks-files.json /repo || status=$?
          exit "$status"
      - name: Analyze source code
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --disable-version-check \
            --json-output=/reports/semgrep.json /src
      - name: Scan dependencies and generate SBOM
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          scan fs --no-progress --scanners vuln --include-dev-deps --format json --output /reports/trivy.json /src
          scan convert --format table /reports/trivy.json
          scan fs --no-progress --include-dev-deps --format cyclonedx --output /reports/sbom.cdx.json /src
      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: ${{ runner.temp }}/ci-reports/
          retention-days: 14

  release:
    name: Release backend image
    needs: [verify, security]
    if: ${{ github.repository == 'OlgaRhythm/Market_AI_assistent_backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: backend-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and package Linux image
        shell: bash
        run: |
          revision="${GITHUB_SHA:0:12}"
          image="market-ai-assistant-backend:sha-$revision"
          asset="backend-linux-amd64-$revision.tar.gz"
          mkdir -p release
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          docker save "$image" | gzip -1 > "release/$asset"

          cat > "release/compose.backend-$revision.yml" <<EOF
          services:
            backend:
              build: !reset null
              image: $image
              pull_policy: never
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          revision="${GITHUB_SHA:0:12}"
          tag="backend-$revision"
          asset="backend-linux-amd64-$revision.tar.gz"
          override="compose.backend-$revision.yml"

          cat > "$RUNNER_TEMP/backend-release-notes.md" <<EOF
          Backend Docker image for Linux amd64, built from commit $GITHUB_SHA.

          Download both assets, then load the image:

              docker image load -i $asset

          From the Compose stack directory, with the override file next to docker-compose.yml, update the backend on an already running stand:

              docker compose -f docker-compose.yml -f $override up -d --no-deps --no-build backend
          EOF

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "$tag" "release/$asset" "release/$override" --clobber
              gh release edit "$tag" --draft=false
            else
              echo "Release $tag already exists."
            fi
          else
            gh release create "$tag" "release/$asset" "release/$override" \
              --target "$GITHUB_SHA" --title "Backend image $revision" \
              --notes-file "$RUNNER_TEMP/backend-release-notes.md"
          fi
