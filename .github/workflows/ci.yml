name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SQLite native module
        run: npm rebuild sqlite3 --build-from-source
      - name: Run regression and API security tests
        run: npm run test:allure
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: allure-results-backend/
          retention-days: 14
      - name: Compile TypeScript
        run: npm run build
      - name: Build Docker image
        if: ${{ github.repository != 'OlgaRhythm/Market_AI_assistent_backend' || github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: docker build --tag app:ci .

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      SEMGREP_IMAGE: semgrep/semgrep:1.184.0
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create report directory
        run: mkdir -p "$RUNNER_TEMP/ci-reports"
      - name: Check Git history and files for secrets
        run: |
          scan() {
            docker run --rm \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              "$GITLEAKS_IMAGE" "$@"
          }
          status=0
          scan git --log-opts=--all --redact=100 --report-format=json --report-path=/reports/gitleaks-history.json /repo || status=$?
          scan dir --redact=100 --report-format=json --report-path=/reports/gitleaks-files.json /repo || status=$?
          exit "$status"
      - name: Analyze source code
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --disable-version-check \
            --json-output=/reports/semgrep.json /src
      - name: Scan dependencies and generate SBOM
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          scan fs --no-progress --scanners vuln --include-dev-deps --format json --output /reports/trivy.json /src
          scan convert --format table /reports/trivy.json
          scan fs --no-progress --include-dev-deps --format cyclonedx --output /reports/sbom.cdx.json /src
      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: ${{ runner.temp }}/ci-reports/
          retention-days: 14

  release:
    name: Release Compose stack
    needs: [verify, security]
    if: ${{ github.repository == 'OlgaRhythm/Market_AI_assistent_backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: stack-release-${{ github.sha }}
      cancel-in-progress: false
    env:
      FRONTEND_SHA: 3f31732919c3ed9c42e74e53472c3c1456ec9b97
      MOCK_SHA: 5bb98d4a6f1d64be7cd4c60c7945475771b05268
      ML_SHA: f8a6b98ae6073145b59828060b5516af8628b236
    steps:
      - uses: actions/checkout@v6
        with:
          path: source/backend
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: OlgaRhythm/ai-assistent-frontend
          ref: ${{ env.FRONTEND_SHA }}
          path: source/frontend
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: OlgaRhythm/ai-assistent-marketplace-mock
          ref: ${{ env.MOCK_SHA }}
          path: source/mock
          persist-credentials: false
      - name: Check out the tested ML revision
        run: |
          git init source/ml
          git -C source/ml fetch --no-tags --depth=1 https://gitlab.com/Elitra/ai-assistant.git "$ML_SHA"
          git -C source/ml checkout --detach FETCH_HEAD
          test "$(git -C source/ml rev-parse HEAD)" = "$ML_SHA"
      - name: Build and package the stack
        run: bash source/backend/release/pack-stack.sh source "$RUNNER_TEMP/stack-release"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="stack-${GITHUB_SHA:0:12}"
          output="$RUNNER_TEMP/stack-release"
          assets=("$output"/assets/*)

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false
            else
              echo "Release $tag already exists."
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "Compose stack ${GITHUB_SHA:0:12}" \
              --notes-file "$output/RELEASE.md"
          fi
